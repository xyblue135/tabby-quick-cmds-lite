name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Peer deps (Tabby / Angular) are provided by Tabby at runtime and are
      # declared only as peerDependencies, so skip auto-installing them.
      - name: Install build tooling
        run: npm install --legacy-peer-deps

      - name: Build (TypeScript -> dist)
        run: npm run build

      - name: Verify dist artifact is valid
        run: node --check dist/index.js
